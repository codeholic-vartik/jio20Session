name: Deploy Notification Services App

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    environment: jio20 session
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.APP_DIR }}"
            PM2_APP_NAME="${{ secrets.PM2_APP_NAME }}"
            REPO_URL="${{ secrets.REPO_URL }}"

            if [ ! -d "$APP_DIR/.git" ]; then
              if [ -z "$REPO_URL" ]; then
                echo "REPO_URL secret is required to bootstrap repository." >&2
                exit 1
              fi
              mkdir -p "$APP_DIR"
              if [ -z "$(ls -A "$APP_DIR" 2>/dev/null)" ]; then
                git clone "$REPO_URL" "$APP_DIR"
              else
                echo "$APP_DIR exists but is not a Git repository." >&2
                exit 1
              fi
            fi

            cd "$APP_DIR"

            git fetch --prune origin
            git checkout -B develop origin/develop

            npm install
            npm run build
            pm2 restart "$PM2_APP_NAME" || pm2 start dist/src/main.js --name "$PM2_APP_NAME"
