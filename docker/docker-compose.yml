version: '3.9'
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=9000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/jio20_session?schema=public
      - REDIS_URL=redis://redis:6379
      - REDIS_BULLMQ_URL=redis://redis-bull:6379
    ports:
      - '9000:9000'
    depends_on:
      - db
      - redis
      - redis-bull
  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jio20_session
    ports:
      - '5432:5432'
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
  redis-bull:
    image: redis:7-alpine
    ports:
      - '6380:6379'


